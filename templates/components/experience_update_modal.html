<div id="update-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="update-experience-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="update-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup modal"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="update-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup modal">×</button>

        <h2 id="update-experience-title">Update Experience</h2>

        <form id="update-experience-form" method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
