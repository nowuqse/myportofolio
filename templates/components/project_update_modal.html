<div id="update-project-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="update-project-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="update-project-modal"
            popovertargetaction="hide"
            aria-label="Close update modal">
    </button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="update-project-modal"
                popovertargetaction="hide"
                aria-label="Close update modal">
            &times;
        </button>

        <h2 id="update-project-modal-title">
            Update Project
        </h2>

        <form id="update-project-form"
              class="project-form">

            <input type="hidden"
                   id="update-project-id">

            <div class="form-group">
                <label for="update-project-title">
                    Project Name
                </label>

                <input type="text"
                       id="update-project-title"
                       maxlength="255"
                       required>
            </div>

            <div class="form-group">
                <label for="update-project-description">
                    Project Description
                </label>

                <textarea id="update-project-description"
                          rows="3"
                          required></textarea>
            </div>

            <div class="form-group">
                <label for="update-project-category">
                    Category
                </label>

                <select id="update-project-category" required>
                    {% for value, label in category_choices %}
                        <option value="{{ value }}">
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-project-modal"
                        popovertargetaction="hide">
                    Cancel
                </button>

                <button type="submit" class="button">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
