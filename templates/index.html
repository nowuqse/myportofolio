{% extends 'base.html' %}
{% block content %}
    <main>
        <main>
            <section class="hero" id="profile">
                <div class="container hero-grid">
                    <div class="hero-identity">
                        <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                        <h1>{{ name }}</h1>
                    </div>
                    <div class="hero-photo">
                        <div class="photo-block"></div>
                        <img class="avatar" src="/static/img/cindyhaha.jpeg" alt="Photo of {{ name }}">
                    </div>
                    <div class="hero-details">
                        <p class="bio">{{ bio }}</p>
                        <dl class="meta-list">
                            <div class="meta-row">
                                <dt>NPM</dt>
                                <dd>{{ npm }}</dd>
                            </div>
                            <div class="meta-row">
                                <dt>Program</dt>
                                <dd>{{ study_program }}</dd>
                            </div>
                        </dl>
                        <div class="social-links">
                            <a href="https://github.com/nowuqse" class="social-link">GitHub</a>
                            <a href="https://linkedin.com/in/cindy-olivia-chai-885b12369" class="social-link">LinkedIn</a>
                            <a href="mailto:cindyoliviachai@gmail.com" class="social-link">Email</a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="favorite-song">
                <div class="container">
                    <p class="section-kicker"></p>

                    <div class="song-card">
                        <div class="song-info">
                            <a href="https://open.spotify.com/track/1j2fdmjSCJZkfCLFKZTOpd?si=3IuDL8ktQ7e1Tx9VGOsCWw&utm_source=copy-link" class="song-link" target="_blank">
                                Lolipop ♫
                            </a>
                            <p class="song-artist">Giselle and Ning Ning of Aespa</p>
                        </div>

                        <button class="play-button" onclick="document.getElementById('song').play()">
                                ▶
                        </button>

                        <audio id="song">
                            <source src="/static/audio/Lolipop.mp3" type="audio/mpeg">
                        </audio>

                    </div>
                    
                </div>
            </section>
        </main>
    </main>
{% endblock content %}
